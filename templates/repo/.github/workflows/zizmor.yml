# GHA-09: static analysis of GitHub Actions workflows with zizmor.
# Fails the check on findings (no Advanced Security needed). To upload SARIF to
# code scanning instead, set `advanced-security: true` and grant
# `security-events: write` to the job.
name: zizmor

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1 # GHA-03: pin the tool too; the action defaults to "latest"
          advanced-security: false
          annotations: true
