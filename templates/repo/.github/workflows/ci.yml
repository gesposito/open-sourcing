# Hardened CI skeleton. Replace the build/test steps with your project's.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {} # GHA-04: no token permissions unless a job asks

concurrency: # GHA-21: cancel superseded PR runs, never runs on main
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # GHA-20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # GHA-07
      # GHA-24: dependency caching is fine here (not a privileged job), e.g.
      # - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      #   with:
      #     node-version: 24
      #     cache: npm
      - run: echo "build and test here"
