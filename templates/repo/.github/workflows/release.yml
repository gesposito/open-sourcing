# Release workflow shape from guidelines/releases.md (example: npm package).
#
#   build ──► publish (environment: release, OIDC) ──► github-release (tag + immutable release)
#
# Prerequisites (verify with `oss repo-check owner/repo`):
#   - Environment `release`: required reviewer(s), "Prevent self-review" on,
#     deployment branches limited to `main` (REL-05).
#   - npm: trusted publisher configured for this repo + this workflow file +
#     environment `release` (REL-01). For PyPI use pypa/gh-action-pypi-publish,
#     for crates.io rust-lang/crates-io-auth-action (pin them, GHA-02).
#   - Immutable releases enabled (REL-03).
#   - Optional: ruleset `tag-requires-release` (REL-06) — the tag is created in
#     `github-release`, after `publish` has deployed to `release` successfully.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.2.3)"
        required: true
        type: string

permissions: {} # GHA-04

# Never cancel a release in flight (GHA-21).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # GHA-08 / REL-04: no caches in release builds
      - name: Check version matches package.json
        env:
          VERSION: ${{ inputs.version }} # never interpolate inputs into run: directly
        run: |
          test "$(node -p 'require("./package.json").version')" = "$VERSION"
      - run: npm ci --ignore-scripts
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: "*.tgz"
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release # REL-05: approval by another maintainer, main only
    permissions:
      contents: read
      id-token: write # GHA-05: only this job can mint OIDC tokens
      attestations: write # REL-02
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # ships npm >= 11.5.1, required for trusted publishing
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "*.tgz"
      # Trusted Publishing (REL-01): no NPM_TOKEN; provenance is automatic.
      - run: npm publish ./*.tgz --access public

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      # `gh release create` uploads assets to a draft and publishes last, which
      # is compatible with immutable releases (REL-03).
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" ./*.tgz \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes
